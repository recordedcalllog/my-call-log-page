<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Audio Collection</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: auto;
      padding: 25px;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
    }

    .audio-card {
      background: white;
      padding: 18px;
      margin: 15px 0;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .audio-card h2 {
      font-size: 18px;
      margin-top: 0;
    }

    audio {
      width: 100%;
    }
  </style>
</head>

<body>

  <h1>🎧 My Audio Collection</h1>

  <div class="audio-card">
  <h2>Audio 1</h2>
  <audio controls>

  </audio>
</div>

<div class="audio-card">

</html>
